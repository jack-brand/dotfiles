shell = /usr/bin/zsh

font = IosevkaMono Nerd Font:pixelsize=20:antialias=true
font-bold = IosevkaMono Nerd Font:style=Bold:pixelsize=20:antialias=true
font-italic = IosevkaMono Nerd Font:style=Italic:pixelsize=20:antialias=true
font-bold-italic = IosevkaMono Nerd Font:style=Bold Italic:pixelsize=20:antialias=true

dpi-aware = yes
pad = 9x9 center
vertical-letter-offset = -1px
line-height = 24px
letter-spacing = -1px
bold-text-in-bright = palette-based
resize-delay-ms = 90

[cursor]
style = beam
blink = yes

[bell]
urgent = yes
notify = yes
visual = yes

[mouse]
hide-when-typing = yes
alternate-scroll-mode = no

[url]
launch = xdg-open ${url}

[colors]
background = 181818
foreground = e4e4ef
alpha = 0.5
flash = f5f5f5
urls = 96a6c8

regular0 = 181818
bright0 = 453d41
regular1 = f33841
bright1 = ff4f58
regular2 = 73c936
bright2 = 73c936
regular3 = ffdd33
bright3 = ffdd33
regular4 = 96a6c8
bright4 = 96a6c8
regular5 = 9e95c7
bright5 = 9e95c7
regular6 = 95a99f
bright6 = 95a99f
regular7 = e4e4ef
bright7 = f5f5f5

