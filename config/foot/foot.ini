shell = /usr/bin/zsh

font = monospace:pixelsize=26:antialias=true
font-bold = monospace:style=Bold:pixelsize=26:antialias=true
font-italic = monospace:style=Italic:pixelsize=26:antialias=true
font-bold-italic = monospace:style=Bold Italic:pixelsize=26:antialias=true

dpi-aware = yes
pad = 9x9 center
vertical-letter-offset = 0px
letter-spacing = 0px
bold-text-in-bright = palette-based
resize-delay-ms = 40

[cursor]
style = beam
blink = yes

[bell]
urgent = no
notify = no
visual = no

[mouse]
hide-when-typing = yes
alternate-scroll-mode = no

[url]
launch = xdg-open ${url}

[colors-dark]
background = 181818
foreground = e4e4ef
selection-background = 423d21
alpha = 0.9
flash = 181818 
urls = 96a6c8

regular0 = 181818
bright0 = 453d41
regular1 = f33841
bright1 = ff4f58
regular2 = 73c936
bright2 = 73c936
regular3 = ffdd33
bright3 = ffdd33
regular4 = 96a6c8
bright4 = 96a6c8
regular5 = 9e95c7
bright5 = 9e95c7
regular6 = 95a99f
bright6 = 95a99f
regular7 = e4e4ef
bright7 = f5f5f5
