# Author: Jack Brand <74jdvb@gmail.com> <https://github.com/jack-brand>
# Credit: tony <https://github.com/tonybanters/mangowc-btw>
# For more options, see https://github.com/DreamMaoMao/mango/wiki/

# window effects
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=4
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# animations
# animation_type = (zoom | slide)
# tag_animation_direction = (1 => horizontal | 0 => vertical)
animations=0
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# scroller layout
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# master-stack layout
new_is_master=0
default_master_factor=0.5
default_master_count=1
tag_num=9
smart_gaps=0

# dwindle layout
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# overview
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=30
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=50
repeat_delay=200
numlock_on=0
xkb_rules_layout=us

# trackpad (applies on relogin)
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse (applies on relogin)
mouse_natural_scrolling=0

# appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=0x201b14ff
border_color=0x00000000
drop_color=0x8fba7c55
split_color=0xeb441eff
focus_color=0x453d4155
maximized_screen_color=0x89aa61ff
urgent_color=0xf43841ff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# KEY BINDINGS

# bind = modifier, key, action, args, sync_across_monitors
# `xev` and `wev` key names are used.
# modifier = (super | ctrl | alt | shift | none)

# reload config
bind=alt,r,reload_config

# exit
bind=alt,q,quit
bind=alt,w,killclient,

# switch window focus
bind=alt,tab,focusstack,next
bind=alt,h,focusdir,left
bind=alt,l,focusdir,right
bind=alt,k,focusdir,up
bind=alt,j,focusdir,down

# swap window
bind=super+alt+shift,k,exchange_client,up
bind=super+alt+shift,j,exchange_client,down
bind=super+alt+shift,h,exchange_client,left
bind=super+alt+shift,l,exchange_client,right

# switch window status
bind=alt,g,toggleglobal,
bind=alt+shift,tab,togglejump,
bind=alt,backslash,togglefloating,
bind=alt,a,togglemaximizescreen,
bind=alt,f,togglefullscreen,
bind=alt+shift,f,togglefakefullscreen,
bind=alt,m,minimized,
bind=alt,o,toggleoverlay,
bind=alt+shift,m,restore_minimized
bind=alt,z,toggle_scratchpad

# scroller layout
bind=alt,e,set_proportion,1.0
bind=alt,x,switch_proportion_preset,
bind=ctrl+super+alt,h,scroller_stack,left
bind=ctrl+super+alt,l,scroller_stack,right
bind=ctrl+super+alt,k,scroller_stack,up
bind=ctrl+super+alt,j,scroller_stack,down

# dwindle layout (manual split mode)
bind=alt+shift,return,dwindle_toggle_split_direction

# switch layout
bind=alt,n,switch_layout

# gaps
bind=alt,comma,incgaps,1
bind=alt+shift,comma,incgaps,-1
bind=alt,period,togglegaps

# move floating windows 
#bind=ctrl+shift,k,movewin,+0,-50
#bind=ctrl+shift,j,movewin,+0,+50
#bind=ctrl+shift,h,movewin,-50,+0
#bind=ctrl+shift,l,movewin,+50,+0

# resize windows
bind=alt+shift,k,resizewin,+0,-50
bind=alt+shift,j,resizewin,+0,+50
bind=alt+shift,h,resizewin,-50,+0
bind=alt+shift,l,resizewin,+50,+0

# The second arg of `view` and `tag` is whether to sync the action across monitors.
# layout_name = (tile | scroller | grid | deck | monocle | center_tile | vertical_tile | vertical_scroller)

# layout of each tag
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# change focused tag 
bind=super,h,viewtoleft,0
bind=super,l,viewtoright,0
bind=super,1,view,1,0
bind=super,2,view,2,0
bind=super,3,view,3,0
bind=super,4,view,4,0
bind=super,5,view,5,0
bind=super,6,view,6,0
bind=super,7,view,7,0
bind=super,8,view,8,0
bind=super,9,view,9,0

# change tag of focused client
bind=super+shift,h,tagtoleft,0
bind=super+shift,l,tagtoright,0
# fyi: `tag` moves the client and focuses it;
# `tagsilent` moves the client without focussing it.
bind=super+shift,1,tagsilent,1,0
bind=super+shift,2,tagsilent,2,0
bind=super+shift,3,tagsilent,3,0
bind=super+shift,4,tagsilent,4,0
bind=super+shift,5,tagsilent,5,0
bind=super+shift,6,tagsilent,6,0
bind=super+shift,7,tagsilent,7,0
bind=super+shift,8,tagsilent,8,0
bind=super+shift,9,tagsilent,9,0

# change focused monitor
bind=ctrl+super,h,focusmon,left
bind=ctrl+super,l,focusmon,right
bind=ctrl+super+shift,h,tagmon,left
bind=ctrl+super+shift,l,tagmon,right

# mouse buttons
# fyi: btn_left and btn_right can't use the `none` mod key
mousebind=alt,btn_left,moveresize,curmove
mousebind=none,btn_middle,togglemaximizescreen,0
mousebind=alt,btn_right,moveresize,curresize

# axis
axisbind=alt,up,viewtoleft_have_client
axisbind=alt,down,viewtoright_have_client

# gestures 
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# launcher and terminal
bind=alt,space,spawn_shell,pkill -x fuzzel || fuzzel
bind=alt,return,spawn,foot --working-directory=$HOME
bind=alt,s,spawn,screenshot  # custom script
bind=alt,b,spawn,qutebrowser

# layer rules
layer_rule=no_blur:0,layer_name:launcher
layer_rule=no_blur:0,layer_name:fuzzel

# app specific rules
window_rule=idle_inhibit_when_focus:1,app_id:steam
window_rule=scroller_proportion:1.0,app_id:steam

# environment variables
env=QT_QPA_PLATFORMTHEME,qt6ct
env=XDG_DATA_DIRS,~/.local/share:/usr/local/share:/usr/share
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=XDG_CONFIG_HOME,~/.config

# startup
exec_once=swaybg -i ~/pictures/wallpapers/isle_of_the_dead/'Bocklin, Arnold - Die Toteninsel III.png' &
exec_once=waybar -c $XDG_CONFIG_HOME/waybar/config.jsonc -s $XDG_CONFIG_HOME/waybar/style.css &
exec_once=pipewire &
#exec_once=gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
